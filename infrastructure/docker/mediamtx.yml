# MediaMTX configuration for STREAMCLIP local / self-hosted ingest.
# The control plane authenticates publishers via HTTP hooks.
#
# Required env (compose):
#   MTX_AUTHHTTPADDRESS  → https://…/api/v1/ingest/hooks/auth
#   INGEST_HOOK_SECRET   → same value as the API's INGEST_HOOK_SECRET

logLevel: info
logDestinations: [stdout]

# 1080p60 bursts + HLS remux: large reader queue (power of 2 only).
writeQueueSize: 8192
readTimeout: 60s
writeTimeout: 60s

rtmp: yes
rtmpEncryption: "no"
rtmpAddress: :1935

# TLS for RTMPS is terminated by a reverse proxy or provided via serverKey/serverCert.
rtmps: no
rtmpsAddress: :1936

srt: yes
srtAddress: :8890

webrtc: no
# Local HLS for dashboard preview (proxied; do not expose :8888 publicly).
hls: yes
hlsAddress: 127.0.0.1:8888
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
rtsp: no

pathDefaults:
  # Only authenticated publishers may write; nobody reads from here publicly.
  source: publisher
  # Native record keeps full publisher quality (1080p/60fps bitstream).
  # Local compose: under /recordings (create via volume if needed).
  record: yes
  recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 5m
  recordDeleteAfter: 2h
  # Auth webhook (MediaMTX v1.9+). Headers carry our shared secret.
  overridePublisher: yes

authMethod: http
# Overridden at runtime by the compose service (MTX_AUTHHTTPADDRESS).
authHTTPAddress: http://api:8000/api/v1/ingest/hooks/auth
authHTTPExclude: []
# MediaMTX ≥ 1.9. Injected by compose via env substitution when supported;
# otherwise set the same secret in a local override file.
authHTTPAdditionalHeaders:
  X-Streamclip-Ingest-Secret: "${INGEST_HOOK_SECRET}"

paths:
  # OBS publishes to rtmps://host/live/{public_id} with password = stream secret.
  "live/~path":
    source: publisher
